<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Pairs — LexiVault</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
<script src="/static/js/study.js"></script>
<script src="/static/js/sfx.js"></script>
<script>(function(){var t=localStorage.getItem('lv_t')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="study-nav">
  <a href="/deck/{{ d.id }}" class="study-x">✕</a>
  <div class="study-bar"><div class="study-fill" id="prog" style="width:0%"></div></div>
  <div id="ctr" style="font-size:13px;font-weight:700;color:var(--text2);"></div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div style="font-size:13px;font-weight:800;color:var(--purple);">⚡ <span id="live-score">0</span></div>
    <button class="sfx-btn" id="sfx-tog">🔊</button>
  <span id="ti" style="font-size:16px;cursor:pointer;" onclick="togT()">☀️</span>
  </div>
</div>
<div class="study-wrap" id="main" style="max-width:700px;">
  <div class="q-label">🧩 Lật thẻ để tìm cặp từ — nghĩa khớp nhau</div>
  <div style="text-align:center;margin-bottom:14px;font-size:13px;color:var(--text2);">
    Cặp tìm được: <span id="found" style="font-weight:800;color:var(--green);">0</span>/<span id="total-pairs">0</span>
    · Lượt lật: <span id="moves" style="font-weight:800;">0</span>
  </div>
  <div class="memory-grid" id="mem-grid" style="grid-template-columns:repeat(4,1fr);"></div>
</div>
<div class="study-wrap result" id="res" style="display:none;">
  <div class="result-ico">🧩</div>
  <div class="result-title">Tìm hết cặp rồi!</div>
  <div class="result-xp" id="res-xp">⚡ +0 XP</div>
  <div class="result-stats">
    <div class="rs"><div class="v" id="r-score">0</div><div class="l">🏆 Điểm</div></div>
    <div class="rs"><div class="v" id="r-moves">0</div><div class="l">👆 Lượt lật</div></div>
    <div class="rs"><div class="v" id="r-time">0s</div><div class="l">⏱️ Thời gian</div></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
    <button onclick="restart()" class="btn btn-p btn-lg">🔄 Chơi lại</button>
    <a href="/game/wordbomb/{{ d.id }}" class="btn btn-r btn-lg">💣 Word Bomb</a>
    <a href="/deck/{{ d.id }}" class="btn btn-ghost btn-lg">← Về bộ từ</a>
  </div>
</div>
<script>
const words={{ words|tojson }};const DECK_ID={{ d.id }};const LANG='{{ d.language }}';
const PAIRS=Math.min(8,Math.floor(words.length/1));
let cards=[],flipped=[],matched=0,moves=0,locked=false,t0=Date.now();
applyT(localStorage.getItem('lv_t')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

function init(){
  const selected=shuffle([...words]).slice(0,PAIRS);
  document.getElementById('total-pairs').textContent=PAIRS;
  // Create pairs: word card + meaning card
  const items=[];
  selected.forEach(w=>{
    items.push({id:w.id,text:w.word,type:'word',pairId:w.id,lang:LANG});
    items.push({id:w.id+'_m',text:w.meaning,type:'mean',pairId:w.id});
  });
  cards=shuffle(items);
  const grid=document.getElementById('mem-grid');grid.innerHTML='';
  cards.forEach((card,i)=>{
    const div=document.createElement('div');
    div.className='mem-card face-down';div.dataset.i=i;div.dataset.pid=card.pairId;div.dataset.type=card.type;
    div.onclick=()=>flipCard(i,div,card);
    grid.appendChild(div);
  });
}
function flipCard(i,el,card){
  if(locked||el.classList.contains('matched')||flipped.find(f=>f.i===i))return;
  el.classList.remove('face-down');
  el.textContent=card.text;
  if(card.type==='word')speak(card.text,LANG);
  flipped.push({i,el,card});
  if(flipped.length===2){moves++;document.getElementById('moves').textContent=moves;checkMatch();}
}
function checkMatch(){
  locked=true;
  const [a,b]=flipped;
  if(a.card.pairId===b.card.pairId&&a.card.type!==b.card.type){
    a.el.classList.add('matched');b.el.classList.add('matched');SFX.play('pairFound');
    matched++;document.getElementById('found').textContent=matched;
    document.getElementById('live-score').textContent=matched*50;
    flipped=[];locked=false;
    if(matched>=PAIRS)setTimeout(finish,400);
  } else {
    setTimeout(()=>{
      a.el.classList.add('face-down');a.el.textContent='';
      b.el.classList.add('face-down');b.el.textContent='';
      flipped=[];locked=false;
    },900);
  }
}
async function finish(){
  const dur=Math.round((Date.now()-t0)/1000);
  const score=Math.max(0,PAIRS*50-moves*5);
  document.getElementById('r-score').textContent=score;
  document.getElementById('r-moves').textContent=moves;
  document.getElementById('r-time').textContent=dur+'s';
  const d=await saveScore('memorypairs',DECK_ID,score,dur);
  document.getElementById('res-xp').textContent=`⚡ +${d.xp_earned||0} XP`;
  document.getElementById('main').style.display='none';document.getElementById('res').style.display='block';
}
function restart(){matched=0;moves=0;flipped=[];locked=false;t0=Date.now();
  document.getElementById('live-score').textContent=0;
  document.getElementById('found').textContent=0;document.getElementById('moves').textContent=0;
  document.getElementById('main').style.display='';document.getElementById('res').style.display='none';init();}
initSoundToggle("sfx-tog");
init();
</script>
</body></html>
