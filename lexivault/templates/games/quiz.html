<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz — LexiVault</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
<script src="/static/js/study.js"></script>
<script src="/static/js/sfx.js"></script>
<script>(function(){var t=localStorage.getItem('lv_t')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="study-nav">
  <a href="/deck/{{ d.id }}" class="study-x">✕</a>
  <div class="study-bar"><div class="study-fill" id="prog" style="width:0%"></div></div>
  <div id="ctr" style="font-size:13px;font-weight:700;color:var(--text2);"></div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div style="font-size:13px;font-weight:800;color:var(--purple);">⚡ <span id="live-score">0</span></div>
    <button class="sfx-btn" id="sfx-tog">🔊</button>
  <span id="ti" style="font-size:16px;cursor:pointer;" onclick="togT()">☀️</span>
  </div>
</div>
<div class="study-wrap" id="main">
  <div class="q-label">Chọn nghĩa đúng của từ</div>
  <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;">
    <div class="q-big" id="q-word"></div>
    <button onclick="speak(words[idx].word,LANG)" class="speak-btn" style="font-size:22px;">🔊</button>
  </div>
  <div class="q-pron" id="q-pron"></div>
  <div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:16px;" id="q-pos"></div>
  <div class="opts" id="opts"></div>
</div>
<div class="fb-bar" id="fb">
  <div><div class="fb-title" id="fb-t"></div><div class="fb-sub" id="fb-s"></div></div>
  <button class="btn btn-g" onclick="nextQ()">Tiếp →</button>
</div>
<div class="study-wrap result" id="res" style="display:none;">
  <div class="result-ico" id="res-ico">🏆</div>
  <div class="result-title">Quiz hoàn thành!</div>
  <div class="result-xp" id="res-xp">⚡ +0 XP</div>
  <div class="result-stats">
    <div class="rs"><div class="v" id="r-c">0</div><div class="l">✅ Đúng</div></div>
    <div class="rs"><div class="v" id="r-w">0</div><div class="l">❌ Sai</div></div>
    <div class="rs"><div class="v" id="r-a">0%</div><div class="l">🎯 Chính xác</div></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
    <button onclick="restart()" class="btn btn-b btn-lg">🔄 Làm lại</button>
    <a href="/deck/{{ d.id }}" class="btn btn-ghost btn-lg">← Về bộ từ</a>
    <a href="/game/typing/{{ d.id }}" class="btn btn-p btn-lg">⌨️ Typing</a>
  </div>
</div>
<script>
const words=shuffle({{ words|tojson }});
const DECK_ID={{ d.id }};const LANG='{{ d.language }}';
let idx=0,correct=0,wrong=0,answered=false,t0=Date.now();
applyT(localStorage.getItem('lv_t')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

function load(){
  if(idx>=words.length){finish();return;}
  answered=false;
  const w=words[idx];
  document.getElementById('q-word').textContent=w.word;
  document.getElementById('q-pron').textContent=w.pronunciation?`[${w.pronunciation}]`:'';
  document.getElementById('q-pos').textContent=w.part_of_speech||'';
  document.getElementById('ctr').textContent=`${idx+1}/${words.length}`;
  document.getElementById('prog').style.width=`${idx/words.length*100}%`;
  document.getElementById('live-score').textContent=correct*20;
  document.getElementById('fb').className='fb-bar';
  const wrongs=getWrongs(words,w);
  const opts=shuffle([w,...wrongs]);
  const div=document.getElementById('opts');div.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<strong>${o.meaning}</strong>`;
    b.onclick=()=>pick(o.meaning,w.meaning,b);div.appendChild(b);
  });
  setTimeout(()=>speak(w.word,LANG),300);
}
async function pick(sel,ans,btn){
  if(answered)return;answered=true;
  const ok=sel===ans;
  if(ok)SFX.play("correct");else SFX.play("wrong");
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.querySelector('strong').textContent===ans)b.classList.add('ok');});
  if(!ok){btn.classList.add('ng');wrong++;}else{correct++;}
  await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({word_id:words[idx].id,deck_id:DECK_ID,correct:ok})});
  const fb=document.getElementById('fb');
  fb.className='fb-bar show '+(ok?'ok':'ng');
  document.getElementById('fb-t').textContent=ok?'🎉 Chính xác!':'❌ Sai rồi!';
  document.getElementById('fb-s').textContent=ok?`${words[idx].word} = ${ans}`:`Đáp án: ${ans}`;
}
function nextQ(){idx++;load();}
async function finish(){
  document.getElementById('prog').style.width='100%';
  const acc=Math.round(correct/words.length*100);
  document.getElementById('r-c').textContent=correct;document.getElementById('r-w').textContent=wrong;document.getElementById('r-a').textContent=acc+'%';
  document.getElementById('res-ico').textContent=acc>=80?'🏆':acc>=50?'⭐':'💪';
  const score=correct*20;
  const d=await saveScore('quiz',DECK_ID,score,Math.round((Date.now()-t0)/1000));
  document.getElementById('res-xp').textContent=`⚡ +${d.xp_earned||0} XP`;
  document.getElementById('fb').className='fb-bar';
  document.getElementById('main').style.display='none';document.getElementById('res').style.display='block';
}
function restart(){idx=0;correct=0;wrong=0;t0=Date.now();words.sort(()=>Math.random()-.5);
  document.getElementById('main').style.display='';document.getElementById('res').style.display='none';load();}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&answered){e.preventDefault();nextQ();}});
load();
</script>
</body></html>
